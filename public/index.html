<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Monitor and control your Mineflayer bot instances from a single dashboard." />
    <title>Bot Portal · Mineflayer Control</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="kicker">Mineflayer Control</p>
        <h1>Bot Portal</h1>
        <p class="sub">Start, stop, and monitor your bot instances from one place.</p>
      </header>

      <section id="loginPanel" class="auth-panel">
        <h2 class="auth-title">Sign In</h2>
        <form id="loginForm" class="auth-form">
          <input id="usernameInput" class="auth-input" type="text" placeholder="Username" autocomplete="username" required />
          <input id="passwordInput" class="auth-input" type="password" placeholder="Password" autocomplete="current-password" required />
          <button id="loginBtn" class="btn btn-good" type="submit">Login</button>
        </form>
        <p id="authState" class="muted">Not signed in</p>
      </section>

      <section id="toolbar" class="toolbar hidden">
        <button id="refreshBtn" class="btn">⟳ Refresh</button>
        <button id="startAllBtn" class="btn btn-good">▶ Start All</button>
        <button id="stopAllBtn" class="btn btn-danger">■ Stop All</button>
        <button id="logoutBtn" class="btn">Logout</button>
        <span id="lastUpdated" class="muted"></span>
      </section>

      <section id="botsGrid" class="grid"></section>
    </main>
    <script src="/vendor/skinview3d.bundle.js"></script>
    <script src="/dashboard.js"></script>
  </body>
</html>
